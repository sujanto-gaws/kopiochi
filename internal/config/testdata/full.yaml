server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  read_header_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "120s"
  shutdown_timeout: "30s"
  request_timeout: "60s"

db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "file-password"
  name: "kopiochi_test"
  sslmode: "disable"
  max_conns: 10
  min_conns: 2

log:
  level: "info"
  format: "json"

auth:
  private_key_path: "keys/private.pem"
  public_key_path: "keys/public.pem"
  issuer: "kopiochi-test"
  client_id: "kopiochi-test"
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"
  mfa_temporary_ttl: "5m"
  max_failed_attempts: 5
  lock_duration: "15m"

plugins:
  middleware: []
  auth: {}
  cache: {}
  custom: {}
