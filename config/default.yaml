server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  read_header_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "120s"
  shutdown_timeout: "30s"
  # Must not exceed write_timeout: the write deadline is what actually cuts
  # the connection, so a request_timeout above it would let the connection
  # be severed mid-response instead of completing or timing out cleanly
  # (see docs/architectures/03-configuration/configuration-model.md and
  # Config.Validate).
  request_timeout: "25s"
  # CIDR allowlist of proxies whose X-Forwarded-For/X-Real-Ip headers are
  # trusted when resolving the client IP. Empty (default) = trust nothing,
  # always use the raw socket address. Only add entries here if the service
  # sits behind a proxy/load balancer you control, e.g. ["10.0.0.0/8"].
  trusted_proxies: []
  # Emits Strict-Transport-Security (internal/httpx.SecurityHeaders). Only
  # turn this on for a deployment where TLS is genuinely terminated in front
  # of this process -- it always listens plain HTTP itself. Leaving this on
  # for a plain-HTTP origin (e.g. local dev on http://localhost) can get the
  # header cached by a browser and lock out later plain-HTTP access.
  enable_hsts: false

db:
  host: "localhost"
  port: 5432
  user: "postgres"
  # password intentionally omitted - set via APP_DB_PASSWORD env var
  name: "kopiochi"
  sslmode: "disable"
  max_conns: 10
  min_conns: 2
  # Connection lifetimes. These were hardcoded in internal/db until Phase
  # 3.8; the values here are the ones it used, so this is configurability
  # rather than a behaviour change. conn_max_idle_time must not exceed
  # conn_max_lifetime, or the idle setting can never take effect
  # (Config.Validate rejects that).
  conn_max_lifetime: "1h"
  conn_max_idle_time: "30m"
  # How often the pool checks idle connections for liveness, so a
  # connection severed by a firewall or a failover is discovered by the
  # pool rather than by a request.
  health_check_period: "1m"
  # Bounds a single dial. Without it a network partition makes every
  # connection attempt hang instead of failing fast.
  connect_timeout: "5s"
  # Bounds the whole open-and-ping sequence at boot. Must be >=
  # connect_timeout, which it has to accommodate at least once.
  startup_timeout: "15s"

log:
  level: "info"
  format: "json"

# Auth / JWT configuration
auth:
  private_key_path: "keys/private.pem"
  public_key_path: "keys/public.pem"
  # Key rotation: keep the retired public key here until the longest-lived
  # token it signed has expired (refresh_token_ttl), then remove it. Swapping
  # the signing key without this invalidates every token already issued —
  # every active session logged out at once.
  previous_public_key_path: ""
  issuer: "kopiochi"
  client_id: "kopiochi"
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"   # 7 days
  mfa_temporary_ttl: "5m"
  max_failed_attempts: 5
  lock_duration: "15m"
  # Clock-skew allowance applied when validating a token's exp (see
  # docs/architectures/04-security/token-architecture.md). Keep this small.
  token_leeway: "30s"

# Cross-cutting HTTP security middleware.
#
# These are not plugins. The plugin registry that used to assemble them
# (plugins.middleware / plugins.custom) has been deleted; CORS and rate
# limiting are constructed directly from the typed config below in
# internal/httpx.NewRouter. See
# docs/architectures/01-modularity/extension-framework.md.
#
# Because the fields are typed, a YAML type error (rate: "500") now fails
# startup instead of being silently replaced by a default nobody chose.
security:
  cors:
    # Off by default. A same-origin or non-browser API needs no CORS
    # headers at all, and enabling the middleware without an allowlist
    # still grants no origin access -- deny-by-default either way.
    enabled: false
    # Allowlist-only: an Origin is granted Access-Control-Allow-Origin
    # only if it appears here. A literal "*" is accepted as an explicit,
    # deliberate wildcard, but combining it with allow_credentials: true
    # is rejected at config load (Config.Validate) -- the CORS spec
    # forbids that combination and browsers ignore it, so failing loudly
    # at boot is correct.
    allowed_origins: []
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
    allowed_headers: ["Accept", "Content-Type", "Content-Length", "Accept-Encoding", "X-CSRF-Token", "Authorization"]
    allow_credentials: false
    # Preflight cache lifetime, as a duration rather than a bare number
    # of seconds, so a unit mistake is impossible.
    max_age: "5m"

  rate_limit:
    enabled: false
    # Sustained allowance, in requests per minute, per client IP as
    # resolved by internal/middleware.RealIP (trusted proxies only).
    rate: 100
    # Bucket capacity: the instantaneous allowance a key may spend
    # before it is throttled down to `rate`.
    burst: 100
    # How long an idle bucket is kept before the sweep evicts it.
    ttl: "10m"
    # Hard cap on tracked keys. Once full, brand-new keys are rejected
    # rather than evicting an existing bucket -- evict-oldest would let
    # a key-flooding attacker reset a throttled client's budget.
    max_keys: 100000

# Prometheus metrics.
#
# Served on their own listener, never on the API port. /metrics exposes the
# route table, latency distributions, database pool saturation and the
# process's memory and file-descriptor counts -- an inventory of the service's
# internals with no business being reachable from the internet. Config.Validate
# rejects an addr equal to the API's own for exactly that reason.
metrics:
  enabled: false
  # Loopback by default. Binding 0.0.0.0 here should be a deliberate decision
  # paired with a network policy, not something that happens by enabling a
  # feature.
  addr: "127.0.0.1:9090"
  path: "/metrics"

# Notification module: the outbox, the background dispatcher that drains it,
# and the channels it can deliver over.
#
# The module validates this section itself (modules/notification/config.go),
# from its constructor, so a bad value fails the boot that read it rather than
# the first notification that needs it. internal/config carries and defaults
# these values but cannot validate them: the shared kernel must not import a
# business module.
notification:
  # Off means no routes, no dispatcher goroutine, and no database access at
  # all -- the module still builds and its Close is still safe to call.
  enabled: true

  dispatcher:
    # How often each worker looks for claimable rows, and how often the
    # stalled-row sweep runs.
    poll_interval: "5s"
    # Rows per claim. A cycle that claims a full batch claims again
    # immediately rather than waiting for the next tick, so this bounds one
    # round trip, not the drain rate.
    batch_size: 50
    # Concurrent claim-render-send loops. Claiming is exclusive in the
    # database (FOR UPDATE SKIP LOCKED), so this is a throughput knob, not a
    # correctness one.
    workers: 2
    # Retry budget. A row that has failed this many times is dead-lettered.
    max_attempts: 6
    # min(backoff_base * 2^attempts, backoff_cap), jittered inside the cap so
    # a retry never waits longer than backoff_cap. base must not exceed cap --
    # a cap below the base clamps the very first retry and the exponential
    # never happens.
    backoff_base: "30s"
    backoff_cap: "1h"
    # How long a row may sit in "sending" before the sweep treats the worker
    # that claimed it as dead and recovers it. It must be comfortably longer
    # than the slowest sender: recovering a row that is merely slow costs it
    # an attempt and can dead-letter it.
    stalled_after: "5m"
    # How long Close waits for in-flight deliveries to settle before giving up
    # on them. Rows still in flight after this are left in "sending" for the
    # next process's sweep -- delivery is at-least-once either way.
    drain_timeout: "30s"

  email:
    # Off until it is configured. Turning it on requires smtp_host, from, and
    # APP_NOTIFICATION_EMAIL_PASSWORD; the module refuses to build without
    # them rather than starting and dead-lettering every mail.
    #
    # With it off, no email sender is registered and an enqueue for the email
    # channel is REFUSED at the producer -- loudly -- instead of accepted and
    # silently dropped.
    enabled: false
    smtp_host: ""
    smtp_port: 587
    from: ""
    # password intentionally omitted - set via APP_NOTIFICATION_EMAIL_PASSWORD

  log_sender:
    # The development sender: writes the rendered message to the log and
    # settles the row as sent. Because it settles rows as sent without sending
    # anything, it is never a fallback -- it must be asked for by name, and it
    # cannot claim a channel that already has a real sender.
    enabled: false
    channel: "email"
