server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  read_header_timeout: "10s"
  write_timeout: "30s"
  idle_timeout: "120s"
  shutdown_timeout: "30s"
  # Must not exceed write_timeout: the write deadline is what actually cuts
  # the connection, so a request_timeout above it would let the connection
  # be severed mid-response instead of completing or timing out cleanly
  # (see docs/architectures/03-configuration/configuration-model.md and
  # Config.Validate).
  request_timeout: "25s"
  # CIDR allowlist of proxies whose X-Forwarded-For/X-Real-Ip headers are
  # trusted when resolving the client IP. Empty (default) = trust nothing,
  # always use the raw socket address. Only add entries here if the service
  # sits behind a proxy/load balancer you control, e.g. ["10.0.0.0/8"].
  trusted_proxies: []

db:
  host: "localhost"
  port: 5432
  user: "postgres"
  # password intentionally omitted - set via APP_DB_PASSWORD env var
  name: "kopiochi"
  sslmode: "disable"
  max_conns: 10
  min_conns: 2

log:
  level: "info"
  format: "json"

# Auth / JWT configuration
auth:
  private_key_path: "keys/private.pem"
  public_key_path: "keys/public.pem"
  issuer: "kopiochi"
  client_id: "kopiochi"
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"   # 7 days
  mfa_temporary_ttl: "5m"
  max_failed_attempts: 5
  lock_duration: "15m"

# Plugin Configuration
plugins:
  # Middleware plugins (applied in order)
  middleware:
    - cors
    - ratelimit
  
  # Authentication plugins
  auth:
    jwt:
      enabled: false
      provider: jwt-auth
      config:
        # secret intentionally omitted - set via APP_JWT_SECRET env var
        expiry: "24h"
        issuer: "kopiochi"
  
  # Cache plugins
  cache:
    redis:
      enabled: false
      provider: redis
      config:
        host: "localhost"
        port: 6379
        password: ""
        db: 0
  
  # Custom plugins
  #
  # "cors" (internal/plugins/middleware/cors.go) is allowlist-only and
  # deny-by-default: with no "cors" section here (the shipped default), no
  # Origin is ever granted Access-Control-Allow-Origin. To allow specific
  # frontends, add e.g.:
  #
  #   cors:
  #     allowed_origins: ["https://app.example.com"]
  #     allow_credentials: true
  #
  # A literal "*" is accepted as an explicit, deliberate wildcard, but
  # combining it with allow_credentials: true is rejected at config load
  # (Config.Validate) -- the CORS spec forbids that combination and
  # browsers ignore it, so failing loudly at boot is correct.
  custom: {}