# golangci-lint configuration.
#
# The depguard rules below express the dependency rules in
# docs/architectures/01-modularity/dependency-rules.md that can be stated as
# "these files may not import these packages".
#
# depguard matches on file globs, so it can only police boundaries that are
# known when this file is written. The generic rules — "module A must not
# import module B", for any A and B — live in tools/archtest, which walks the
# real import graph and therefore also covers modules added after this file
# was last touched. The two are complementary; neither replaces the other.

version: "2"

# The standard set is on as of Phase 4.4. It was scoped to depguard alone
# through Phase 3 because the tree carried 35 pre-existing findings and a
# workflow that fails on its first run trains everyone to ignore it. Those 35
# are now cleared, so the gate is real.
linters:
  default: standard
  enable:
    - depguard

  settings:
    staticcheck:
      # Everything except QF1008. That check rewrites `cfg.DB.Name` into
      # `cfg.Name` because DB is an embedded field — which removes the only
      # token telling the reader *which* config section is being read.
      # Config is the one place in this tree where the embedded-field name
      # carries the meaning, so the check is wrong here and applying it
      # across the 11 sites it flags would make the code harder to read.
      checks:
        - "all"
        - "-QF1008"

    depguard:
      rules:
        # R1 — the domain layer is the innermost ring. Standard library and
        # internal/platform only. A domain that imports the ORM cannot be
        # tested without standing up a database.
        domain-purity:
          files:
            - "**/modules/*/domain/**"
          deny:
            - pkg: github.com/uptrace/bun
              desc: domain must not depend on the ORM
            - pkg: github.com/go-chi/chi/v5
              desc: domain must not depend on the HTTP router
            - pkg: github.com/spf13/viper
              desc: domain must not depend on configuration loading
            - pkg: github.com/rs/zerolog
              desc: domain must not depend on the logger
            - pkg: github.com/jackc/pgx/v5
              desc: domain must not depend on the database driver

        # R1 — application services talk to domain interfaces; the
        # composition root chooses the implementations.
        application-purity:
          files:
            - "**/modules/*/application/**"
          deny:
            - pkg: github.com/uptrace/bun
              desc: application talks to domain interfaces, not the ORM
            - pkg: github.com/go-chi/chi/v5
              desc: application must not depend on the HTTP router

        # R1 — the transport layer speaks HTTP, so it may reach into the
        # shared kernel for the two packages that define HTTP contracts:
        # internal/authn (who the caller is) and internal/httpx (how an error
        # is written). Nothing else from internal/** — not the ORM wrapper,
        # not config, not the logger. A transport package that can reach
        # internal/db can query the database from a handler, which is the
        # layering this ring exists to prevent.
        #
        # list-mode: lax is what makes "deny the tree, allow two leaves"
        # expressible. In lax mode an import is allowed unless denied, and a
        # deny is overridden by a *longer* matching allow prefix — so
        # internal/authn (longer) beats internal (shorter), while internal/db
        # matches only the deny. Under the default "original" mode a non-empty
        # allow list would forbid every import not on it, including chi and the
        # module's own application layer.
        #
        # Test files are out of scope on purpose. The rule polices the shipped
        # artifact; test binaries legitimately use internal/testsupport for
        # keypairs, token minting and (from task B1) the fake authn.Middleware
        # that replaces minting a real JWT in every handler test.
        transport-kernel-access:
          list-mode: lax
          files:
            - "**/modules/*/transport/**"
            - "!**/*_test.go"
          allow:
            - github.com/sujanto-gaws/kopiochi/internal/authn
            - github.com/sujanto-gaws/kopiochi/internal/httpx
          deny:
            - pkg: github.com/sujanto-gaws/kopiochi/internal
              desc: transport may use only internal/authn and internal/httpx from the shared kernel

        # R1 — the same fence, drawn around transport's test files.
        #
        # transport-kernel-access above excludes *_test.go, which was correct
        # for that rule and left the test binaries with no rule at all: a
        # transport test could import internal/db and query the database
        # directly to set up its fixture, and nothing would say a word. A
        # sibling list closes that without touching the rule above, because
        # depguard evaluates every list whose file globs match — they are
        # independent, not alternatives.
        #
        # The extra allowance over the production rule is internal/testsupport
        # and nothing else. That is where the keypairs, the token minting and
        # (task B1) FakeAuth live, so it is the one shared-kernel package a
        # transport test has a reason to reach for. A test that finds itself
        # wanting internal/db wants a repository fake or an integration test in
        # infrastructure, not a wider fence.
        #
        # Two file globs, not one: transport test files sit directly in
        # modules/<m>/transport/, and a `transport/**/*_test.go` pattern needs
        # at least one intermediate directory to match — gobwas/glob's `**`
        # would have to match the empty string and still supply the following
        # separator, which it cannot. The one-level pattern is the one that
        # matches every test file in the tree today; the nested one covers a
        # future subpackage. See the note on list-mode: lax above — it is
        # load-bearing here for the same reason.
        transport-test-kernel-access:
          list-mode: lax
          files:
            - "**/modules/*/transport/*_test.go"
            - "**/modules/*/transport/**/*_test.go"
          allow:
            - github.com/sujanto-gaws/kopiochi/internal/authn
            - github.com/sujanto-gaws/kopiochi/internal/httpx
            - github.com/sujanto-gaws/kopiochi/internal/testsupport
          deny:
            - pkg: github.com/sujanto-gaws/kopiochi/internal
              desc: transport tests may use only internal/authn, internal/httpx and internal/testsupport from the shared kernel

        # R3 — the shared kernel is shared. The moment it knows about one
        # business module, it stops being shared and the dependency inverts
        # for the whole tree.
        platform-independence:
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/sujanto-gaws/kopiochi/modules
              desc: internal/** must not depend on a business module; only cmd/** imports both

  exclusions:
    generated: lax
    rules:
      # Generated swagger output is not ours to lint.
      - path: ^docs/
        linters:
          - depguard

issues:
  # Report everything. golangci-lint defaults to max-issues-per-linter: 50 and
  # max-same-issues: 3, which silently truncates its own output — a run can
  # print "21 issues" when the tree actually has 60, and the count shrinks as
  # you fix them rather than the list. That is the same class of silent cap as
  # the go test cache masking architecture violations (see tools/archtest),
  # and it is worth exactly as little in a gate.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
