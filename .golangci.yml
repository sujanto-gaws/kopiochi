# golangci-lint configuration.
#
# The depguard rules below express the dependency rules in
# docs/architectures/01-modularity/dependency-rules.md that can be stated as
# "these files may not import these packages".
#
# depguard matches on file globs, so it can only police boundaries that are
# known when this file is written. The generic rules — "module A must not
# import module B", for any A and B — live in tools/archtest, which walks the
# real import graph and therefore also covers modules added after this file
# was last touched. The two are complementary; neither replaces the other.

version: "2"

# The standard set is on as of Phase 4.4. It was scoped to depguard alone
# through Phase 3 because the tree carried 35 pre-existing findings and a
# workflow that fails on its first run trains everyone to ignore it. Those 35
# are now cleared, so the gate is real.
linters:
  default: standard
  enable:
    - depguard

  settings:
    staticcheck:
      # Everything except QF1008. That check rewrites `cfg.DB.Name` into
      # `cfg.Name` because DB is an embedded field — which removes the only
      # token telling the reader *which* config section is being read.
      # Config is the one place in this tree where the embedded-field name
      # carries the meaning, so the check is wrong here and applying it
      # across the 11 sites it flags would make the code harder to read.
      checks:
        - "all"
        - "-QF1008"

    depguard:
      rules:
        # R1 — the domain layer is the innermost ring. Standard library and
        # internal/platform only. A domain that imports the ORM cannot be
        # tested without standing up a database.
        domain-purity:
          files:
            - "**/modules/*/domain/**"
          deny:
            - pkg: github.com/uptrace/bun
              desc: domain must not depend on the ORM
            - pkg: github.com/go-chi/chi/v5
              desc: domain must not depend on the HTTP router
            - pkg: github.com/spf13/viper
              desc: domain must not depend on configuration loading
            - pkg: github.com/rs/zerolog
              desc: domain must not depend on the logger
            - pkg: github.com/jackc/pgx/v5
              desc: domain must not depend on the database driver

        # R1 — application services talk to domain interfaces; the
        # composition root chooses the implementations.
        application-purity:
          files:
            - "**/modules/*/application/**"
          deny:
            - pkg: github.com/uptrace/bun
              desc: application talks to domain interfaces, not the ORM
            - pkg: github.com/go-chi/chi/v5
              desc: application must not depend on the HTTP router

        # R3 — the shared kernel is shared. The moment it knows about one
        # business module, it stops being shared and the dependency inverts
        # for the whole tree.
        platform-independence:
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/sujanto-gaws/kopiochi/modules
              desc: internal/** must not depend on a business module; only cmd/** imports both

  exclusions:
    generated: lax
    rules:
      # Generated swagger output is not ours to lint.
      - path: ^docs/
        linters:
          - depguard

issues:
  # Report everything. golangci-lint defaults to max-issues-per-linter: 50 and
  # max-same-issues: 3, which silently truncates its own output — a run can
  # print "21 issues" when the tree actually has 60, and the count shrinks as
  # you fix them rather than the list. That is the same class of silent cap as
  # the go test cache masking architecture violations (see tools/archtest),
  # and it is worth exactly as little in a gate.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
